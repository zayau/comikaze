[package]
name = "comikaze"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generate hand-drawn comic panel frames and page layouts as SVG"
license = "MIT"
repository = "https://github.com/zayau/comikaze"
readme = "README.md"
keywords = ["svg", "comics", "cli", "graphics"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
chacha20 = { version = "0.10.1", default-features = false, features = ["rng"] }
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
